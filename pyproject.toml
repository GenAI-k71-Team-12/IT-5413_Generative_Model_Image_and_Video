[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iharmony"
version = "0.1.0"
description = "Modular Image Harmonization framework on iHarmony4 (U-Net, PatchGAN, Hybrid, DINOv2+Lab, RainNet, HT+)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pytorch-msssim>=1.0.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
]

[tool.setuptools.packages.find]
where = ["src"]
